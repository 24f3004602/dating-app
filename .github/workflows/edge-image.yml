# Builds the closed beta's app image (infra/beta/app.Dockerfile: Caddy with the app's web
# build) here instead of on the beta's own laptop, where the build ran it out of memory
# (D118). Run by hand; the image comes back as a one-day artifact for `docker load` on
# the beta computer (replica/deploy.md). Nothing is pushed or deployed: the owner's
# computer loads it and restarts that one container. The image holds only the public web
# app and the Caddyfile; every build setting is public (the domain and the name).
name: edge-image

on:
  workflow_dispatch:
    inputs:
      domain:
        description: The beta's domain (the app calls api.<domain> and links to <domain>)
        required: true
        default: kinaara.online
      brand_name:
        description: The working name (BRAND_NAME in infra/beta/.env)
        required: true
        default: Kinaara
      brand_name_devanagari:
        description: The name in Devanagari for the welcome sign (empty for the Latin name only)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: edge-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOMAIN: ${{ inputs.domain }}
      BRAND_NAME: ${{ inputs.brand_name }}
      BRAND_NAME_DEVANAGARI: ${{ inputs.brand_name_devanagari }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the inputs
        run: |
          [[ "$DOMAIN" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$ ]] || { echo "not a domain: $DOMAIN"; exit 1; }
          [ -n "$BRAND_NAME" ] || { echo "the name is empty"; exit 1; }
      - name: Build the image as compose builds the edge service (infra/beta/compose.yaml)
        run: |
          docker build --file infra/beta/app.Dockerfile --tag datingapp-edge:beta \
            --build-arg EXPO_PUBLIC_API_URL="https://api.${DOMAIN}" \
            --build-arg EXPO_PUBLIC_WEB_URL="https://${DOMAIN}" \
            --build-arg BRAND_NAME="${BRAND_NAME}" \
            --build-arg BRAND_NAME_DEVANAGARI="${BRAND_NAME_DEVANAGARI}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            .
      - name: Check the app inside points at the beta
        run: |
          docker run --rm --entrypoint sh -e WANT="https://api.${DOMAIN}" datingapp-edge:beta \
            -c 'grep -rqF "$WANT" /srv/app && echo "the bundle calls $WANT"'
      - name: Save the image
        run: |
          docker save datingapp-edge:beta | gzip > edge-image.tar.gz
          ls -l edge-image.tar.gz
          sha256sum edge-image.tar.gz | tee edge-image.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edge-image
          path: |
            edge-image.tar.gz
            edge-image.sha256
          retention-days: 1
          compression-level: 0
