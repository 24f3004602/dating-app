[project]
name = "datingapp-api"
version = "0.1.0"
description = "API and worker for the dating app (modular monolith)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.*",
    "argon2-cffi==25.1.*",
    "email-validator==2.3.*",
    "fastapi==0.162.*",
    "procrastinate==3.10.*",
    "psycopg[binary,pool]==3.3.*",
    "pydantic==2.14.*",
    "pydantic-settings==2.16.*",
    "redis==8.1.*",
    "sqlalchemy[asyncio]==2.1.*",
    "tzdata>=2026.1",
    "uvicorn==0.54.*",
]

[project.scripts]
datingapp-api = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx==0.28.*",
    "mypy==2.4.*",
    "pip-audit==2.10.*",
    "pytest==9.2.*",
    "pytest-asyncio==1.4.*",
    "ruff==0.17.*",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PT", "DTZ", "T20", "N", "PL", "PERF"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915"]
"scripts/**" = ["T201"]
"app/cli.py" = ["T201"]
"migrations/**" = ["S608"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "migrations", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error", "ignore::DeprecationWarning:pip_audit.*"]
